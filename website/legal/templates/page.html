<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>{{title}} · Z-Aura</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#content">{{skipLabel}}</a>
  <header><div class="wrap">
    <a class="brand" href="index.html">Z-Aura</a>
    <nav aria-label="{{navLabel}}">
      <a href="{{indexPath}}">{{aboutLabel}}</a>
      <a href="{{termsPath}}">{{termsLabel}}</a>
      <a href="{{privacyPath}}">{{privacyLabel}}</a>
      <a href="https://t.me/zaurafork" rel="noreferrer">{{telegramLabel}}</a>
      <a href="{{otherLanguagePath}}" lang="{{otherLanguage}}" data-language-link>{{languageLabel}}</a>
    </nav>
    <label class="preferences">{{themeLabel}} <select data-theme-switch aria-label="{{themeLabel}}"><option value="light">{{lightLabel}}</option><option value="dark">{{darkLabel}}</option></select></label>
  </div></header>
  <main id="content" class="wrap">
    {{draftBanner}}
    {{body}}
  </main>
  <footer id="contact" class="wrap">
    <p>{{ownerLabel}} {{ownerName}}.<br>{{contactIntro}} <a href="{{contactUrl}}">{{contactLabel}}</a>.</p>
    <p>{{independence}}</p>
    <p>{{newsIntro}} <a href="https://t.me/zaurafork" rel="noreferrer">Telegram · @zaurafork</a>. {{privateContact}}</p>
  </footer>
  <script src="preferences.js"></script>
</body>
</html>
